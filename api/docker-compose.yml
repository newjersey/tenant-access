services:
  postgres:
    image: postgres:16
    container_name: tenant-access-test-db
    environment:
      POSTGRES_DB: tenantaccess
      POSTGRES_USER: tenantadmin
      POSTGRES_PASSWORD: localtestonly
    ports:
      - "55432:5432"
    tmpfs:
      - /var/lib/postgresql/data
    command: postgres -c fsync=off -c synchronous_commit=off -c full_page_writes=off
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tenantadmin -d tenantaccess"]
      interval: 1s
      timeout: 3s
      retries: 30
