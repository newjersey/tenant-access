name: db-tests

on:
  workflow_call:

permissions:
  contents: read

jobs:
  db-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
      - name: Install dependencies
        run: npm ci
      - name: Run database tests
        run: npm run test:db
      - name: Stop database
        if: always()
        run: npm run db:down --workspace=api
